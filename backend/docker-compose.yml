# 프로젝트 이름 고정 (없으면 폴더명 "backend"가 이름이 되어 기존 DB 볼륨을 못 찾음)
name: ai-youth-pjt

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # 컨테이너를 꺼도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]                # 기본 실행에서는 안 뜸
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"                      # 브라우저에서 localhost:5050
    depends_on:
      - postgres

volumes:
  pgdata: