server:
  port: ${PORT:8080}

spring:
  application:
    name: ai-youth-pjt
  config:
    # backend/.env를 자동으로 읽음 (작업 디렉터리가 backend 폴더여야 함)
    # OS 환경변수나 IntelliJ 실행 설정에 값을 넣으면 그 값이 우선 적용됨
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:ai_youth_pjt_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
      fail-on-reading-dup-tree-key: true
      use-big-decimal-for-floats: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.aiyouth.pjt.global.mybatis
  configuration:
    map-underscore-to-camel-case: true

firsthome:
  recommend-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8001}
  allowed-origins: ${FIRSTHOME_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  session:
    ttl-days: ${FIRSTHOME_SESSION_TTL_DAYS:7}
    cookie-secure: ${FIRSTHOME_SESSION_COOKIE_SECURE:true}
  places:
    kakao-key: ${KAKAO_REST_API_KEY:}
    odsay-key: ${ODSAY_WEB_KEY:}
  rag:
    # 공고문 질문(API 6)의 Node RAG 서비스. 꺼져 있거나 응답이 없으면 DB 원문 발췌로 대체
    enabled: ${RAG_SERVICE_ENABLED:true}
    base-url: ${RAG_SERVICE_URL:http://localhost:8000}
    timeout: ${RAG_SERVICE_TIMEOUT:15s}
